# The protobuf guide, served at baskingspot.dev/protobuf/. The theme and the
# site build come from baskingspot-docs; the router in baskingspot/site serves
# /protobuf/...
base_url = "https://baskingspot.dev/protobuf"
theme = "baskingspot"
title = "protobuf"
description = "Protocol Buffers in Zig: the wire format, and a typed layer over plain structs."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/protobuf"
api = true
